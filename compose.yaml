services:
  app:
    build: .
    ports:
      - "${LOOPBACK_PREFIX:-127.0.0}.1:8080:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting}
      DATABASE_URL: jdbc:sqlite:/data/inventory.db
      UPLOADS_DIRECTORY: /data/uploads
    volumes:
      - product-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 128

volumes:
  product-data:
