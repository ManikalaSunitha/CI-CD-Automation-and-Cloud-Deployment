name: Secure Inventory Development CI/CD
run-name: 'Secure Inventory / dev / ${{ github.event_name }}'

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'compose.yaml'
      - '.github/workflows/secure-inventory.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'compose.yaml'
      - '.github/workflows/secure-inventory.yml'
      - '.github/workflows/secure-inventory-prod.yml'

permissions:
  contents: read

concurrency:
  group: secure-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      earlybird_result: ${{ steps.earlybird.outcome }}
      filesystem_scan_result: ${{ steps.filesystem_scan.outcome }}
      filesystem_scan_details: ${{ steps.filesystem_scan_summary.outputs.details }}
      tests_coverage_result: ${{ steps.tests_coverage.outcome }}
      test_metrics: ${{ steps.test_metrics.outputs.details }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate commit-based image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          safe_branch="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | cut -c1-80)"
          echo "tag=${safe_branch}-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go for EarlyBird
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false

      - name: Checkout pinned EarlyBird scanner
        uses: actions/checkout@v4
        with:
          repository: americanexpress/earlybird
          ref: 573753e6f39a02293d4a250878e66664aefa674a
          path: .tools/earlybird
          persist-credentials: false

      - name: EarlyBird secret and sensitive-data scan
        id: earlybird
        env:
          SCAN_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          go build -C .tools/earlybird -o "$RUNNER_TEMP/go-earlybird" .
          mkdir -p "$HOME/.go-earlybird"
          cp -a .tools/earlybird/config/. "$HOME/.go-earlybird/"
          cp .tools/earlybird/.ge_ignore "$HOME/.ge_ignore"
          git ls-files --error-unmatch src/main/resources/application.properties >/dev/null
          set +e
          "$RUNNER_TEMP/go-earlybird" \
            --path="$SCAN_PATH" \
            --git-tracked \
            --fail-severity=medium \
            --suppress 2>&1 | tee "$RUNNER_TEMP/earlybird.log"
          scan_status=${PIPESTATUS[0]}
          set -e

          {
            echo "### EarlyBird findings"
            echo
            if grep -q '^Finding #' "$RUNNER_TEMP/earlybird.log"; then
              sed -n '/^Finding #/,$p' "$RUNNER_TEMP/earlybird.log"
              echo
              echo "The workflow fails on findings at or above **medium** severity."
            else
              echo "No findings were reported."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$scan_status"

      - name: Scan source dependencies and configuration
        id: filesystem_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          skip-dirs: .tools/earlybird
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-filesystem-results.json

      - name: Summarize filesystem scan findings
        id: filesystem_scan_summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.filesystem_scan.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          def markdown(value):
              return str(value or "—").replace("|", "\\|").replace("\r", " ").replace("\n", " ")

          lines = [
              "### Trivy source and configuration scan",
              f"- Result: **{os.environ.get('SCAN_OUTCOME', 'unknown')}**",
          ]
          report_path = Path("trivy-filesystem-results.json")
          if not report_path.is_file():
              lines.append("- Trivy did not produce a JSON report; inspect the scan step logs.")
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              findings = []
              for result in report.get("Results") or []:
                  for category in ("Vulnerabilities", "Misconfigurations", "Secrets"):
                      for finding in result.get(category) or []:
                          if finding.get("Severity") in {"CRITICAL", "HIGH"}:
                              findings.append((result.get("Target", ""), category, finding))

              counts = Counter(finding.get("Severity") for _, _, finding in findings)
              lines.append(
                  f"- Blocking findings: **{len(findings)}** "
                  f"(CRITICAL: {counts.get('CRITICAL', 0)}, HIGH: {counts.get('HIGH', 0)})."
              )
              if findings:
                  lines.extend([
                      "",
                      "| Severity | Type | File/target | Finding | Details |",
                      "|---|---|---|---|---|",
                  ])
                  findings.sort(
                      key=lambda item: (
                          0 if item[2].get("Severity") == "CRITICAL" else 1,
                          item[1],
                          item[2].get("VulnerabilityID", item[2].get("ID", "")),
                      )
                  )
                  for target, category, finding in findings:
                      lines.append(
                          "| "
                          + " | ".join(
                              markdown(value)
                              for value in (
                                  finding.get("Severity"),
                                  category,
                                  target,
                                  finding.get("VulnerabilityID", finding.get("ID", finding.get("PkgName"))),
                                  finding.get("Title", finding.get("Message")),
                              )
                          )
                          + " |"
                      )
              else:
                  lines.append("- No HIGH or CRITICAL vulnerabilities, misconfigurations, or secrets were reported.")

          details = "\n".join(lines)
          delimiter = f"TRIVY_FS_DETAILS_{os.getpid()}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"details<<{delimiter}\n{details}\n{delimiter}\n")
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Run tests and enforce 60% minimum line coverage
        id: tests_coverage
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Summarize test and coverage reports
        id: test_metrics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          lines = ["### Maven test and JaCoCo details"]
          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          if reports:
              totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              for report in reports:
                  suite = ET.parse(report).getroot()
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, 0))
              lines.append(
                  f"- Tests: **{totals['tests']}**; failures: **{totals['failures']}**; "
                  f"errors: **{totals['errors']}**; skipped: **{totals['skipped']}**."
              )
          else:
              lines.append("- Surefire XML reports are unavailable; inspect the Maven step logs.")

          coverage_report = Path("target/site/jacoco/jacoco.xml")
          if coverage_report.is_file():
              root = ET.parse(coverage_report).getroot()
              line_counter = next(
                  (counter for counter in root.findall("counter") if counter.attrib.get("type") == "LINE"),
                  None,
              )
              if line_counter is not None:
                  covered = int(line_counter.attrib.get("covered", 0))
                  missed = int(line_counter.attrib.get("missed", 0))
                  total = covered + missed
                  percent = (covered * 100 / total) if total else 0
                  lines.append(f"- JaCoCo line coverage: **{percent:.2f}%** ({covered}/{total} lines; gate: 60%).")
              else:
                  lines.append("- JaCoCo XML was produced without a line-coverage counter.")
          else:
              lines.append("- JaCoCo XML report is unavailable; inspect the Maven step logs.")

          details = "\n".join(lines)
          delimiter = f"TEST_METRICS_{os.getpid()}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"details<<{delimiter}\n{details}\n{delimiter}\n")
          PY

  build-scan-push:
    name: Build, scan, and push dev image
    if: ${{ github.event_name == 'push' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
      ecr_login_result: ${{ steps.ecr_login.outcome }}
      ecr_repository_check_result: ${{ steps.ecr_repository_check.outcome }}
      image_build_result: ${{ steps.image_build.outcome }}
      image_scan_result: ${{ steps.image_scan.outcome }}
      image_scan_details: ${{ steps.image_scan_summary.outputs.details }}
      ecr_push_result: ${{ steps.image.outcome }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify the ECR repository exists in the configured account and region
        id: ecr_repository_check
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set the AWS_REGION Actions variable}"
          : "${ECR_REPOSITORY:?Set the ECR_REPOSITORY Actions variable}"
          : "${REGISTRY:?ECR login did not return a registry}"

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry_account="${REGISTRY%%.*}"
          if [ "$account_id" != "$registry_account" ]; then
            echo "::error::AWS credentials resolve to account $account_id, but ECR login selected registry account $registry_account."
            exit 1
          fi

          if ! repository_uri="$(aws ecr describe-repositories \
            --registry-id "$account_id" \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text 2>ecr-repository-error.txt)"; then
            cat ecr-repository-error.txt >&2
            if grep -q 'AccessDeniedException' ecr-repository-error.txt; then
              echo "::error::The GitHub Actions IAM user is missing ecr:DescribeRepositories for arn:aws:ecr:${AWS_REGION}:${account_id}:repository/${ECR_REPOSITORY}. Add that action to the user's identity-based policy, scoped to this repository ARN, then rerun."
            else
              echo "::error::ECR repository '$ECR_REPOSITORY' was not found in account $account_id, region $AWS_REGION. Create it there or correct AWS_REGION/ECR_REPOSITORY."
            fi
            exit 1
          fi

          expected_uri="$REGISTRY/$ECR_REPOSITORY"
          if [ "$repository_uri" != "$expected_uri" ]; then
            echo "::error::Resolved ECR repository URI '$repository_uri' does not match expected '$expected_uri'."
            exit 1
          fi
          echo "Verified ECR destination: $repository_uri"

      - name: Build image
        id: image_build
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          IMAGE_TAG: ${{ needs.quality.outputs.image_tag }}
        run: docker build --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Scan container image
        id: image_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          IMAGE_TAG: ${{ needs.quality.outputs.image_tag }}
        with:
          image-ref: ${{ steps.ecr_login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ needs.quality.outputs.image_tag }}
          format: json
          output: trivy-image-results.json
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Summarize container scan findings
        id: image_scan_summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.image_scan.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          def markdown(value):
              return str(value or "—").replace("|", "\\|").replace("\r", " ").replace("\n", " ")

          report_path = Path("trivy-image-results.json")
          lines = [
              "### Trivy image scan details",
              f"- Scan step result: **{os.environ.get('SCAN_OUTCOME', 'unknown')}**",
          ]

          if not report_path.is_file():
              lines.append("- No Trivy JSON report was produced; check the scan-step logs for an image pull, scanner, or configuration error.")
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              findings = []
              for result in report.get("Results") or []:
                  for finding in result.get("Vulnerabilities") or []:
                      if finding.get("Severity") in {"CRITICAL", "HIGH"}:
                          findings.append((result.get("Target", ""), finding))

              counts = Counter(finding.get("Severity") for _, finding in findings)
              lines.append(
                  f"- Blocking findings: **{len(findings)}** "
                  f"(CRITICAL: {counts.get('CRITICAL', 0)}, HIGH: {counts.get('HIGH', 0)})."
              )
              if findings:
                  lines.extend([
                      "",
                      "| Severity | Target | Package | Installed | Fixed in | Advisory | Details |",
                      "|---|---|---|---|---|---|---|",
                  ])
                  findings.sort(
                      key=lambda item: (
                          0 if item[1].get("Severity") == "CRITICAL" else 1,
                          item[1].get("VulnerabilityID", ""),
                          item[1].get("PkgName", ""),
                      )
                  )
                  for target, finding in findings:
                      fixed = finding.get("FixedVersion") or "No fixed version listed"
                      lines.append(
                          "| "
                          + " | ".join(
                              markdown(value)
                              for value in (
                                  finding.get("Severity"),
                                  target,
                                  finding.get("PkgName"),
                                  finding.get("InstalledVersion"),
                                  fixed,
                                  finding.get("VulnerabilityID"),
                                  finding.get("Title"),
                              )
                          )
                          + " |"
                      )
                  lines.extend([
                      "",
                      "**Why this blocks the workflow:** the scan is configured to fail on any HIGH or CRITICAL finding. The ECR push step runs only after a successful scan, so the image was not pushed and the ECS deployment could not proceed.",
                  ])
              else:
                  lines.append("- No HIGH or CRITICAL vulnerabilities were reported in the image.")

          details = "\n".join(lines)
          delimiter = f"TRIVY_DETAILS_{os.getpid()}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"details<<{delimiter}\n{details}\n{delimiter}\n")
          PY

      - name: Push image after all scans pass
        id: image
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          IMAGE_TAG: ${{ needs.quality.outputs.image_tag }}
        run: |
          set -euo pipefail
          image_uri="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$image_uri"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

  deploy-ecs:
    name: Deploy dev to ECS
    if: ${{ needs.build-scan-push.result == 'success' }}
    needs: build-scan-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    permissions:
      contents: read
    outputs:
      service_check_result: ${{ steps.service_check.outcome }}
      task_definition_result: ${{ steps.task_def.outcome }}
      ecs_update_result: ${{ steps.ecs_update.outcome }}
      application_host: ${{ vars.APP_HOST }}
      application_port: ${{ vars.APP_PORT }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      IMAGE_URI: ${{ needs.build-scan-push.outputs.image_uri }}
    steps:
      - name: Configure AWS credentials for ECS deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify the selected ECS service is configured for one task
        id: service_check
        shell: bash
        run: |
          set -euo pipefail
          : "${ECS_CLUSTER:?Set the ECS_CLUSTER environment variable}"
          : "${ECS_SERVICE:?Set the ECS_SERVICE environment variable}"

          service_count="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'length(services[?status == `ACTIVE`])' \
            --output text)"
          if [ "$service_count" != "1" ]; then
            echo "Expected one ACTIVE ECS service named $ECS_SERVICE in cluster $ECS_CLUSTER." >&2
            exit 1
          fi

          desired_count="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)"
          if [ "$desired_count" != "1" ]; then
            echo "ECS service $ECS_SERVICE must have desiredCount=1 for this SQLite deployment; found $desired_count." >&2
            exit 1
          fi

      - name: Register task definition with the scanned image
        id: task_def
        shell: bash
        run: |
          set -euo pipefail
          : "${ECS_TASK_DEFINITION:?Set the ECS_TASK_DEFINITION environment variable}"
          : "${ECS_CONTAINER_NAME:?Set the ECS_CONTAINER_NAME environment variable}"
          : "${IMAGE_URI:?The image build job did not publish an image URI}"

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

          container_count="$(jq --arg name "$ECS_CONTAINER_NAME" '[.containerDefinitions[] | select(.name == $name)] | length' task-definition.json)"
          if [ "$container_count" -ne 1 ]; then
            echo "Expected exactly one task-definition container named $ECS_CONTAINER_NAME; found $container_count." >&2
            exit 1
          fi

          jq --arg name "$ECS_CONTAINER_NAME" --arg image "$IMAGE_URI" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions |= map(if .name == $name then .image = $image else . end)
          ' task-definition.json > rendered-task-definition.json

          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json "$(cat rendered-task-definition.json)" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Update ECS service and wait for stability
        id: ecs_update
        run: |
          set -euo pipefail
          : "${ECS_CLUSTER:?Set the ECS_CLUSTER environment variable}"
          : "${ECS_SERVICE:?Set the ECS_SERVICE environment variable}"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task_def.outputs.arn }}" \
            --no-cli-pager
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

  summary:
    name: Run summary
    if: ${{ always() }}
    needs:
      - quality
      - build-scan-push
      - deploy-ecs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_ENVIRONMENT: dev
      DEPLOY_ENABLED: ${{ github.event_name == 'push' }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      BUILD_RESULT: ${{ needs.build-scan-push.result }}
      DEPLOY_RESULT: ${{ needs.deploy-ecs.result }}
      IMAGE_URI: ${{ needs.build-scan-push.outputs.image_uri }}
      IMAGE_TAG: ${{ needs.quality.outputs.image_tag }}
      EARLYBIRD_RESULT: ${{ needs.quality.outputs.earlybird_result }}
      FILESYSTEM_SCAN_RESULT: ${{ needs.quality.outputs.filesystem_scan_result }}
      TESTS_COVERAGE_RESULT: ${{ needs.quality.outputs.tests_coverage_result }}
      TEST_METRICS: ${{ needs.quality.outputs.test_metrics }}
      FILESYSTEM_SCAN_DETAILS: ${{ needs.quality.outputs.filesystem_scan_details }}
      ECR_LOGIN_RESULT: ${{ needs.build-scan-push.outputs.ecr_login_result }}
      ECR_REPOSITORY_CHECK_RESULT: ${{ needs.build-scan-push.outputs.ecr_repository_check_result }}
      IMAGE_BUILD_RESULT: ${{ needs.build-scan-push.outputs.image_build_result }}
      IMAGE_SCAN_RESULT: ${{ needs.build-scan-push.outputs.image_scan_result }}
      IMAGE_SCAN_DETAILS: ${{ needs.build-scan-push.outputs.image_scan_details }}
      ECR_PUSH_RESULT: ${{ needs.build-scan-push.outputs.ecr_push_result }}
      SERVICE_CHECK_RESULT: ${{ needs.deploy-ecs.outputs.service_check_result }}
      TASK_DEFINITION_RESULT: ${{ needs.deploy-ecs.outputs.task_definition_result }}
      ECS_UPDATE_RESULT: ${{ needs.deploy-ecs.outputs.ecs_update_result }}
      APPLICATION_HOST: ${{ needs.deploy-ecs.outputs.application_host }}
      APPLICATION_PORT: ${{ needs.deploy-ecs.outputs.application_port }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
      ACTOR: ${{ github.actor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish workflow summary
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          def value(name, fallback="not run"):
              return os.environ.get(name) or fallback

          def status(name, fallback="not run"):
              result = value(name, fallback).lower()
              icon = {
                  "success": "✅",
                  "failure": "❌",
                  "cancelled": "⚪",
                  "skipped": "⏭️",
                  "not run": "⏭️",
              }.get(result, "⚠️")
              return f"{icon} **{result}**"

          if os.environ.get("QUALITY_RESULT") != "success":
              overall_result = os.environ.get("QUALITY_RESULT", "failure")
          elif os.environ.get("DEPLOY_ENABLED") == "true":
              overall_result = (
                  os.environ.get("BUILD_RESULT", "failure")
                  if os.environ.get("BUILD_RESULT") != "success"
                  else os.environ.get("DEPLOY_RESULT", "failure")
              )
          else:
              overall_result = os.environ.get("QUALITY_RESULT", "unknown")

          application_host = value("APPLICATION_HOST", "")
          application_port = value("APPLICATION_PORT", "")
          application_url = (
              f"http://{application_host}:{application_port}/"
              if application_host and application_port
              else ""
          )
          application_link = (
              f"[{application_host}:{application_port}]({application_url})"
              if application_url
              else "Not configured — set `APP_HOST` and `APP_PORT` in the `dev` GitHub environment."
          )

          lines = [
              "# Secure Inventory — Development run",
              "",
              f"**Overall status:** {status('OVERALL_RESULT', overall_result)}",
              "",
              "## Run context",
              "",
              "| Field | Value |",
              "|---|---|",
              f"| Trigger | `{value('EVENT_NAME')}` |",
              f"| Ref | `{value('REF_NAME')}` |",
              f"| Commit | [`{value('COMMIT_SHA')[:12]}`]({value('RUN_URL')}) |",
              f"| Actor | `{value('ACTOR')}` |",
              f"| Workflow run | [Open run]({value('RUN_URL')}) |",
              f"| Application endpoint | {application_link} |",
              "",
              "## Pipeline results",
              "",
              "| Stage | Result | Details |",
              "|---|---|---|",
              f"| EarlyBird tracked-source secret scan | {status('EARLYBIRD_RESULT', value('QUALITY_RESULT'))} | Findings are listed in the quality job summary. |",
              f"| Trivy filesystem/dependency/configuration scan | {status('FILESYSTEM_SCAN_RESULT', value('QUALITY_RESULT'))} | See the detailed findings below. |",
              f"| Maven tests and JaCoCo coverage gate | {status('TESTS_COVERAGE_RESULT', value('QUALITY_RESULT'))} | See test counts and coverage below. |",
              f"| SonarCloud Automatic Analysis | ℹ️ Independent | Not a deployment gate; review the SonarCloud project separately. |",
              f"| ECR login | {status('ECR_LOGIN_RESULT', value('BUILD_RESULT'))} | AWS authentication and registry login. |",
              f"| ECR repository preflight | {status('ECR_REPOSITORY_CHECK_RESULT', value('BUILD_RESULT'))} | Account, region, and repository URI verified. |",
              f"| Docker image build | {status('IMAGE_BUILD_RESULT', value('BUILD_RESULT'))} | Builds the application container. |",
              f"| Trivy container image scan | {status('IMAGE_SCAN_RESULT', value('BUILD_RESULT'))} | HIGH/CRITICAL findings block publishing. |",
              f"| ECR image push | {status('ECR_PUSH_RESULT', value('BUILD_RESULT'))} | Only occurs after the image scan passes. |",
              f"| ECS dev service check | {status('SERVICE_CHECK_RESULT', value('DEPLOY_RESULT'))} | SQLite deployment requires one active task. |",
              f"| ECS task-definition registration | {status('TASK_DEFINITION_RESULT', value('DEPLOY_RESULT'))} | Registers the scanned image URI. |",
              f"| ECS update and stability wait | {status('ECS_UPDATE_RESULT', value('DEPLOY_RESULT'))} | Waits until the service is stable. |",
              "",
          ]

          if os.environ.get("DEPLOY_ENABLED") == "true" and os.environ.get("DEPLOY_RESULT") == "success" and os.environ.get("APPLICATION_URL"):
              lines.extend(["## Deployed application", "", f"[Open the DEV application]({os.environ['APPLICATION_URL']})"])

          if os.environ.get("DEPLOY_ENABLED") == "true" and os.environ.get("ECR_PUSH_RESULT") == "success":
              lines.extend(["## Published image", ""])
              if os.environ.get("IMAGE_TAG"):
                  lines.append(f"- **Tag:** `{os.environ['IMAGE_TAG']}`")
              if os.environ.get("IMAGE_URI"):
                  lines.append(f"- **Image URI:** `{os.environ['IMAGE_URI']}`")
              if os.environ.get("IMAGE_TAG"):
                  lines.append("- Use this commit-based tag to request a manual production promotion; the production workflow records and deploys the resolved digest.")
          elif os.environ.get("DEPLOY_ENABLED") == "true":
              lines.extend([
                  "## Image publishing",
                  "",
                  "No image was successfully pushed. Do not start a production promotion from this run.",
              ])
          else:
              lines.extend([
                  "## Deployment",
                  "",
                  "This was a pull-request run. AWS publishing and ECS deployment are intentionally skipped.",
              ])

          for name, heading in (
              ("TEST_METRICS", "Test and coverage details"),
              ("FILESYSTEM_SCAN_DETAILS", "Source scan findings"),
              ("IMAGE_SCAN_DETAILS", "Container scan findings"),
          ):
              detail = os.environ.get(name)
              if detail:
                  lines.extend(["", detail])
              elif name == "FILESYSTEM_SCAN_DETAILS":
                  lines.extend(["", f"### {heading}", "", "Detailed Trivy output is unavailable; inspect the scan job logs."])

          if os.environ.get("QUALITY_RESULT") != "success":
              lines.extend([
                  "",
                  "## Next steps",
                  "",
                  "Review the first failed quality gate above and its job logs. Image publishing and ECS deployment run only after all quality gates pass.",
              ])
          elif os.environ.get("DEPLOY_ENABLED") == "true" and os.environ.get("DEPLOY_RESULT") != "success":
              lines.extend([
                  "",
                  "## Next steps",
                  "",
                  "Quality gates passed. Review the first failed ECR or ECS step, verify the AWS permissions and environment configuration, then rerun the workflow.",
              ])

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
