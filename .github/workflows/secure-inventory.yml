name: Secure Inventory CI and ECS Deployment
run-name: 'Secure Inventory / ${{ inputs.target_environment }} / deploy ECS: ${{ inputs.deploy_to_ecs }}'

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Select the environment to deploy when ECS deployment is enabled
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: dev
      deploy_to_ecs:
        description: Deploy to ECS after the image passes quality gates and is pushed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: secure-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates (${{ inputs.target_environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      earlybird_result: ${{ steps.earlybird.outcome }}
      filesystem_scan_result: ${{ steps.filesystem_scan.outcome }}
      tests_coverage_result: ${{ steps.tests_coverage.outcome }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate immutable image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          safe_branch="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | cut -c1-80)"
          echo "tag=${safe_branch}-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go for EarlyBird
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false

      - name: Checkout pinned EarlyBird scanner
        uses: actions/checkout@v4
        with:
          repository: americanexpress/earlybird
          ref: 573753e6f39a02293d4a250878e66664aefa674a
          path: .tools/earlybird
          persist-credentials: false

      - name: EarlyBird secret and sensitive-data scan
        id: earlybird
        env:
          SCAN_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          go build -C .tools/earlybird -o "$RUNNER_TEMP/go-earlybird" .
          mkdir -p "$HOME/.go-earlybird"
          cp -a .tools/earlybird/config/. "$HOME/.go-earlybird/"
          cp .tools/earlybird/.ge_ignore "$HOME/.ge_ignore"
          git ls-files --error-unmatch src/main/resources/application.properties >/dev/null
          "$RUNNER_TEMP/go-earlybird" \
            --path="$SCAN_PATH" \
            --git-tracked \
            --fail-severity=medium \
            --suppress

      - name: Scan source dependencies and configuration
        id: filesystem_scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          skip-dirs: .tools/earlybird
          ignore-unfixed: true
          exit-code: '1'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Run tests and enforce 60% minimum line coverage
        id: tests_coverage
        run: mvn --batch-mode --no-transfer-progress verify

  build-scan-push:
    name: Build, scan, and push (${{ inputs.target_environment }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
      ecr_login_result: ${{ steps.ecr_login.outcome }}
      image_build_result: ${{ steps.image_build.outcome }}
      image_scan_result: ${{ steps.image_scan.outcome }}
      image_scan_details: ${{ steps.image_scan_summary.outputs.details }}
      ecr_push_result: ${{ steps.image.outcome }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: image_build
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          IMAGE_TAG: ${{ needs.quality.outputs.image_tag }}
        run: docker build --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Scan container image
        id: image_scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          IMAGE_TAG: ${{ needs.quality.outputs.image_tag }}
        with:
          image-ref: ${{ steps.ecr_login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ needs.quality.outputs.image_tag }}
          format: json
          output: trivy-image-results.json
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Summarize container scan findings
        id: image_scan_summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.image_scan.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          def markdown(value):
              return str(value or "—").replace("|", "\\|").replace("\r", " ").replace("\n", " ")

          report_path = Path("trivy-image-results.json")
          lines = [
              "### Trivy image scan details",
              f"- Scan step result: **{os.environ.get('SCAN_OUTCOME', 'unknown')}**",
          ]

          if not report_path.is_file():
              lines.append("- No Trivy JSON report was produced; check the scan-step logs for an image pull, scanner, or configuration error.")
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              findings = []
              for result in report.get("Results") or []:
                  for finding in result.get("Vulnerabilities") or []:
                      if finding.get("Severity") in {"CRITICAL", "HIGH"}:
                          findings.append((result.get("Target", ""), finding))

              counts = Counter(finding.get("Severity") for _, finding in findings)
              lines.append(
                  f"- Blocking findings: **{len(findings)}** "
                  f"(CRITICAL: {counts.get('CRITICAL', 0)}, HIGH: {counts.get('HIGH', 0)})."
              )
              if findings:
                  lines.extend([
                      "",
                      "| Severity | Target | Package | Installed | Fixed in | Advisory | Details |",
                      "|---|---|---|---|---|---|---|",
                  ])
                  findings.sort(
                      key=lambda item: (
                          0 if item[1].get("Severity") == "CRITICAL" else 1,
                          item[1].get("VulnerabilityID", ""),
                          item[1].get("PkgName", ""),
                      )
                  )
                  for target, finding in findings:
                      fixed = finding.get("FixedVersion") or "No fixed version listed"
                      lines.append(
                          "| "
                          + " | ".join(
                              markdown(value)
                              for value in (
                                  finding.get("Severity"),
                                  target,
                                  finding.get("PkgName"),
                                  finding.get("InstalledVersion"),
                                  fixed,
                                  finding.get("VulnerabilityID"),
                                  finding.get("Title"),
                              )
                          )
                          + " |"
                      )
                  lines.extend([
                      "",
                      "**Why this blocks the workflow:** the scan is configured to fail on any HIGH or CRITICAL finding. The ECR push step runs only after a successful scan, so the image was not pushed and the ECS deployment could not proceed.",
                  ])
              else:
                  lines.append("- No HIGH or CRITICAL vulnerabilities were reported in the image.")

          details = "\n".join(lines)
          print(details)
          delimiter = f"TRIVY_DETAILS_{os.getpid()}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"details<<{delimiter}\n{details}\n{delimiter}\n")
          PY

      - name: Push image after all scans pass
        id: image
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          IMAGE_TAG: ${{ needs.quality.outputs.image_tag }}
        run: |
          set -euo pipefail
          image_uri="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$image_uri"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

  deploy-ecs:
    name: Deploy ${{ inputs.target_environment }} to ECS
    if: ${{ inputs.deploy_to_ecs }}
    needs: build-scan-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      IMAGE_URI: ${{ needs.build-scan-push.outputs.image_uri }}
    steps:
      - name: Configure AWS credentials for ECS deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify the selected ECS service is configured for one task
        shell: bash
        run: |
          set -euo pipefail
          : "${ECS_CLUSTER:?Set the ECS_CLUSTER environment variable}"
          : "${ECS_SERVICE:?Set the ECS_SERVICE environment variable}"

          service_count="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'length(services[?status == `ACTIVE`])' \
            --output text)"
          if [ "$service_count" != "1" ]; then
            echo "Expected one ACTIVE ECS service named $ECS_SERVICE in cluster $ECS_CLUSTER." >&2
            exit 1
          fi

          desired_count="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)"
          if [ "$desired_count" != "1" ]; then
            echo "ECS service $ECS_SERVICE must have desiredCount=1 for this SQLite deployment; found $desired_count." >&2
            exit 1
          fi

      - name: Register task definition with the scanned image
        id: task-def
        shell: bash
        run: |
          set -euo pipefail
          : "${ECS_TASK_DEFINITION:?Set the ECS_TASK_DEFINITION environment variable}"
          : "${ECS_CONTAINER_NAME:?Set the ECS_CONTAINER_NAME environment variable}"
          : "${IMAGE_URI:?The image build job did not publish an image URI}"

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

          container_count="$(jq --arg name "$ECS_CONTAINER_NAME" '[.containerDefinitions[] | select(.name == $name)] | length' task-definition.json)"
          if [ "$container_count" -ne 1 ]; then
            echo "Expected exactly one task-definition container named $ECS_CONTAINER_NAME; found $container_count." >&2
            exit 1
          fi

          jq --arg name "$ECS_CONTAINER_NAME" --arg image "$IMAGE_URI" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions |= map(if .name == $name then .image = $image else . end)
          ' task-definition.json > rendered-task-definition.json

          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file://rendered-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Update ECS service and wait for stability
        run: |
          set -euo pipefail
          : "${ECS_CLUSTER:?Set the ECS_CLUSTER environment variable}"
          : "${ECS_SERVICE:?Set the ECS_SERVICE environment variable}"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-def.outputs.arn }}" \
            --no-cli-pager
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

  summary:
    name: Run summary (${{ inputs.target_environment }})
    if: ${{ always() }}
    needs:
      - quality
      - build-scan-push
      - deploy-ecs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      DEPLOY_ENABLED: ${{ inputs.deploy_to_ecs }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      BUILD_RESULT: ${{ needs.build-scan-push.result }}
      DEPLOY_RESULT: ${{ needs.deploy-ecs.result }}
      IMAGE_URI: ${{ needs.build-scan-push.outputs.image_uri }}
      IMAGE_TAG: ${{ needs.quality.outputs.image_tag }}
      EARLYBIRD_RESULT: ${{ needs.quality.outputs.earlybird_result }}
      FILESYSTEM_SCAN_RESULT: ${{ needs.quality.outputs.filesystem_scan_result }}
      TESTS_COVERAGE_RESULT: ${{ needs.quality.outputs.tests_coverage_result }}
      ECR_LOGIN_RESULT: ${{ needs.build-scan-push.outputs.ecr_login_result }}
      IMAGE_BUILD_RESULT: ${{ needs.build-scan-push.outputs.image_build_result }}
      IMAGE_SCAN_RESULT: ${{ needs.build-scan-push.outputs.image_scan_result }}
      IMAGE_SCAN_DETAILS: ${{ needs.build-scan-push.outputs.image_scan_details }}
      ECR_PUSH_RESULT: ${{ needs.build-scan-push.outputs.ecr_push_result }}
    steps:
      - name: Publish workflow summary
        shell: bash
        run: |
          {
            echo "# Secure Inventory — ${TARGET_ENVIRONMENT}"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| EarlyBird secret scan | ${EARLYBIRD_RESULT:-${QUALITY_RESULT}} |"
            echo "| Trivy filesystem/dependency/configuration scan | ${FILESYSTEM_SCAN_RESULT:-${QUALITY_RESULT}} |"
            echo "| Maven tests and JaCoCo coverage gate | ${TESTS_COVERAGE_RESULT:-${QUALITY_RESULT}} |"
            echo "| SonarCloud Automatic Analysis | Runs independently; check SonarCloud project |"
            echo "| ECR login | ${ECR_LOGIN_RESULT:-${BUILD_RESULT}} |"
            echo "| Docker image build | ${IMAGE_BUILD_RESULT:-${BUILD_RESULT}} |"
            echo "| Trivy container image scan | ${IMAGE_SCAN_RESULT:-${BUILD_RESULT}} |"
            echo "| ECR image push | ${ECR_PUSH_RESULT:-${BUILD_RESULT}} |"
            if [ "$DEPLOY_ENABLED" = "true" ]; then
              echo "| ECS deployment | ${DEPLOY_RESULT} |"
            else
              echo "| ECS deployment | Skipped (build-only run) |"
            fi
            echo
            if [ -n "$IMAGE_TAG" ]; then
              echo "- Image tag: \`${IMAGE_TAG}\`"
            fi
            if [ -n "$IMAGE_URI" ]; then
              echo "- Image URI: \`${IMAGE_URI}\`"
            fi
            echo
            if [ -n "$IMAGE_SCAN_DETAILS" ]; then
              printf '%s\n' "$IMAGE_SCAN_DETAILS"
            else
              echo "### Trivy image scan details"
              echo "No detailed scan report was passed to the summary job; inspect the build-and-scan job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
