name: Secure Inventory QA Deployment
run-name: 'Deploy Secure Inventory to qa / ${{ inputs.image_tag }}'

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit-based main-<12-character-commit-sha> tag from a successful dev deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: secure-inventory-qa
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy selected DEV image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: qa
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
      image_digest: ${{ steps.image.outputs.uri }}
      ecr_login_result: ${{ steps.ecr-login.outcome }}
      image_pull_result: ${{ steps.image.outcome }}
      image_scan_result: ${{ steps.image-scan.outcome }}
      service_check_result: ${{ steps.service-check.outcome }}
      task_definition_result: ${{ steps.task-def.outcome }}
      ecs_update_result: ${{ steps.ecs-update.outcome }}
      service_url: ${{ steps.service-endpoint.outputs.url }}
      ecs_service: ${{ vars.ECS_SERVICE }}
    steps:
      - name: Validate selected image tag
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^main-[0-9a-f]{12}$ ]]; then
            echo "::error::Select a main-<12-character-commit-sha> image tag from a successful dev workflow run."
            exit 1
          fi
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify and pull the selected DEV image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set AWS_REGION in the qa environment}"
          : "${ECR_REPOSITORY:?Set ECR_REPOSITORY in the qa environment}"
          : "${REGISTRY:?ECR login did not return a registry}"

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry_account="${REGISTRY%%.*}"
          if [ "$account_id" != "$registry_account" ]; then
            echo "::error::AWS credentials resolve to account $account_id, but ECR login selected registry account $registry_account."
            exit 1
          fi

          aws ecr describe-repositories \
            --registry-id "$account_id" \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text >/dev/null

          image_uri="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker pull "$image_uri"
          digest_uri="$(docker image inspect --format='{{index .RepoDigests 0}}' "$image_uri")"
          if [[ ! "$digest_uri" =~ ^"$REGISTRY/$ECR_REPOSITORY"@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve the pulled image to a valid ECR digest."
            exit 1
          fi
          echo "uri=$digest_uri" >> "$GITHUB_OUTPUT"

      - name: Scan selected image by digest
        id: image-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table

      - name: Verify the QA ECS service is configured for one task
        id: service-check
        shell: bash
        run: |
          set -euo pipefail
          : "${ECS_CLUSTER:?Set ECS_CLUSTER in the qa environment}"
          : "${ECS_SERVICE:?Set ECS_SERVICE in the qa environment}"

          service_count="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'length(services[?status == `ACTIVE`])' \
            --output text)"
          if [ "$service_count" != "1" ]; then
            echo "Expected one ACTIVE ECS service named $ECS_SERVICE in cluster $ECS_CLUSTER." >&2
            exit 1
          fi

          desired_count="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)"
          if [ "$desired_count" != "1" ]; then
            echo "ECS service $ECS_SERVICE must have desiredCount=1 for this SQLite deployment; found $desired_count." >&2
            exit 1
          fi

      - name: Register task definition with the scanned image digest
        id: task-def
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          : "${ECS_TASK_DEFINITION:?Set ECS_TASK_DEFINITION in the qa environment}"
          : "${ECS_CONTAINER_NAME:?Set ECS_CONTAINER_NAME in the qa environment}"
          : "${IMAGE_URI:?The selected image digest is unavailable}"

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

          container_count="$(jq --arg name "$ECS_CONTAINER_NAME" '[.containerDefinitions[] | select(.name == $name)] | length' task-definition.json)"
          if [ "$container_count" -ne 1 ]; then
            echo "Expected exactly one task-definition container named $ECS_CONTAINER_NAME; found $container_count." >&2
            exit 1
          fi

          jq --arg name "$ECS_CONTAINER_NAME" --arg image "$IMAGE_URI" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions |= map(if .name == $name then .image = $image else . end)
          ' task-definition.json > rendered-task-definition.json

          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json "$(cat rendered-task-definition.json)" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Update QA ECS service and wait for stability
        id: ecs-update
        env:
          TASK_DEFINITION_ARN: ${{ steps.task-def.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --no-cli-pager
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Resolve deployed service URL
        id: service-endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def aws_json(*args):
              result = subprocess.run(
                  ["aws", *args, "--region", os.environ["AWS_REGION"], "--output", "json"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)

          service = aws_json(
              "ecs", "describe-services",
              "--cluster", os.environ["ECS_CLUSTER"],
              "--services", os.environ["ECS_SERVICE"],
          )["services"][0]
          target_groups = {
              item.get("targetGroupArn")
              for item in service.get("loadBalancers", [])
              if item.get("targetGroupArn")
          }
          if len(target_groups) != 1:
              raise SystemExit(f"Expected one load-balancer target group for the ECS service; found {len(target_groups)}.")

          target_group = aws_json(
              "elbv2", "describe-target-groups",
              "--target-group-arns", next(iter(target_groups)),
          )["TargetGroups"][0]
          load_balancers = target_group.get("LoadBalancerArns", [])
          if len(load_balancers) != 1:
              raise SystemExit(f"Expected one load balancer for the service target group; found {len(load_balancers)}.")

          load_balancer = aws_json(
              "elbv2", "describe-load-balancers",
              "--load-balancer-arns", load_balancers[0],
          )["LoadBalancers"][0]
          matching_listeners = []
          for listener in aws_json(
              "elbv2", "describe-listeners",
              "--load-balancer-arn", load_balancers[0],
          )["Listeners"]:
              rules = aws_json(
                  "elbv2", "describe-rules",
                  "--listener-arn", listener["ListenerArn"],
              )["Rules"]
              forwards_to_target = any(
                  action.get("TargetGroupArn") in target_groups
                  or any(
                      item.get("TargetGroupArn") in target_groups
                      for item in action.get("ForwardConfig", {}).get("TargetGroups", [])
                  )
                  for rule in rules
                  for action in rule.get("Actions", [])
              )
              if forwards_to_target:
                  matching_listeners.append(listener)

          if len(matching_listeners) != 1:
              raise SystemExit(f"Expected one listener forwarding to the service; found {len(matching_listeners)}.")
          listener = matching_listeners[0]
          scheme = {"HTTP": "http", "HTTPS": "https"}.get(listener["Protocol"])
          if not scheme:
              raise SystemExit(f"Unsupported listener protocol for application URL: {listener['Protocol']}.")

          url = f"{scheme}://{load_balancer['DNSName']}:{listener['Port']}/"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"url={url}\n")
          print(f"Resolved deployed ECS service URL: {url}")
          PY

  summary:
    name: QA deployment summary
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      IMAGE_TAG: ${{ needs.deploy.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.deploy.outputs.image_digest }}
      ECR_LOGIN_RESULT: ${{ needs.deploy.outputs.ecr_login_result }}
      IMAGE_PULL_RESULT: ${{ needs.deploy.outputs.image_pull_result }}
      IMAGE_SCAN_RESULT: ${{ needs.deploy.outputs.image_scan_result }}
      SERVICE_CHECK_RESULT: ${{ needs.deploy.outputs.service_check_result }}
      TASK_DEFINITION_RESULT: ${{ needs.deploy.outputs.task_definition_result }}
      ECS_UPDATE_RESULT: ${{ needs.deploy.outputs.ecs_update_result }}
      ECS_SERVICE: ${{ needs.deploy.outputs.ecs_service }}
      APPLICATION_URL: ${{ needs.deploy.outputs.service_url }}
      SOURCE_COMMIT: ${{ inputs.image_tag }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish QA deployment summary
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          def status(name):
              result = os.environ.get(name) or "not run"
              result = result.lower()
              icon = {
                  "success": "✅",
                  "failure": "❌",
                  "cancelled": "⚪",
                  "skipped": "⏭️",
                  "not run": "⏭️",
              }.get(result, "⚠️")
              return f"{icon} **{result}**"

          def markdown(value):
              return str(value or "—").replace("|", "\\|").replace("\r", " ").replace("\n", " ")

          image_tag = os.environ.get("IMAGE_TAG", "")
          run_url = os.environ["RUN_URL"]
          application_url = os.environ.get("APPLICATION_URL", "")
          application_link = (
              f"[{application_url}]({application_url})"
              if application_url
              else "Unavailable — service URL discovery did not complete."
          )
          lines = [
              "# Secure Inventory — QA deployment",
              "",
              f"**Overall status:** {status('DEPLOY_RESULT')}",
              "",
              "## Deployment context",
              "",
              "| Field | Value |",
              "|---|---|",
              f"| Promoted DEV image tag | `{markdown(image_tag)}` |",
              f"| Source commit | `{markdown(os.environ.get('SOURCE_COMMIT', '').removeprefix('main-'))}` |",
              f"| Deployed image tag | `{markdown(os.environ.get('IMAGE_TAG'))}` |",
              f"| Image digest | `{markdown(os.environ.get('IMAGE_DIGEST'))}` |",
              f"| QA ECS service | `{markdown(os.environ.get('ECS_SERVICE'))}` |",
              f"| QA deployed service URL | {application_link} |",
              f"| QA workflow run | [Open run]({run_url}) |",
              "",
              "## Deployment checks",
              "",
              "| Stage | Result | Details |",
              "|---|---|---|",
              f"| ECR authentication | {status('ECR_LOGIN_RESULT')} | Logged in to the configured registry. |",
              f"| Image pull and digest resolution | {status('IMAGE_PULL_RESULT')} | QA deploys the selected commit-based image by immutable digest. |",
              f"| Trivy HIGH/CRITICAL image scan | {status('IMAGE_SCAN_RESULT')} | Deployment is blocked by high or critical findings. |",
              f"| ECS single-task check | {status('SERVICE_CHECK_RESULT')} | SQLite deployment requires one active task. |",
              f"| Task-definition registration | {status('TASK_DEFINITION_RESULT')} | Registers the scanned image digest. |",
              f"| ECS update and stability wait | {status('ECS_UPDATE_RESULT')} | Waits for the QA service to stabilize. |",
          ]
          if os.environ.get("DEPLOY_RESULT") == "success" and application_url:
              lines.extend(["", "## Test the QA application", "", f"[Open QA application]({application_url})"])
          else:
              lines.extend([
                  "",
                  "## Next steps",
                  "",
                  "If deployment failed, review the first failed stage and its job logs. If it succeeded but no application link is shown, check the service URL discovery step.",
              ])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
