spring.application.name=secure-inventory
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:sqlite:inventory.db}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.security.admin-username=${ADMIN_USER:${ADMIN_USERNAME:admin}}
app.security.admin-password=${ADMIN_PASSWORD:}
app.uploads.directory=${UPLOADS_DIRECTORY:uploads}
