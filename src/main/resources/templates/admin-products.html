<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage products | Studio Admin</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/products}"><span class="brand-mark">S</span> studio <span class="text-white-50 fw-normal">/ Admin</span></a>
        <div class="d-flex align-items-center gap-3">
            <a class="text-white text-decoration-none small" th:href="@{/}">View store ↗</a>
            <a class="text-white text-decoration-none small" th:href="@{/admin/users}">Users</a>
            <form th:action="@{/logout}" method="post"><button class="btn btn-sm btn-outline-light" type="submit">Sign out</button></form>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <div><div class="eyebrow text-primary">Your catalogue</div><h1 class="display-6 fw-bold mb-1">Products</h1>
            <p class="text-secondary mb-0">Manage what customers see in the shop.</p></div>
        <a class="btn btn-primary rounded-pill px-4" th:href="@{/admin/products/new}">＋ Add product</a>
    </div>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="panel p-5 text-center" th:if="${#lists.isEmpty(products)}">
        <h2 class="h5">Your shop is ready for its first product</h2>
        <p class="text-secondary">Add a product to make it visible in the storefront.</p>
        <a class="btn btn-primary rounded-pill px-4" th:href="@{/admin/products/new}">Create first product</a>
    </div>
    <div class="row g-3">
        <article class="col-12" th:each="product : ${products}">
            <div class="panel p-3 p-md-4 d-flex flex-column flex-md-row align-items-md-center gap-3">
                <img class="rounded-3 object-fit-cover" style="width: 96px; height: 80px"
                     th:if="${product.imageFilename}" th:src="@{/images/{name}(name=${product.imageFilename})}" th:alt="${product.name}">
                <div class="rounded-3 d-grid place-items-center bg-light text-secondary" style="width: 96px; height: 80px" th:unless="${product.imageFilename}">No image</div>
                <div class="flex-grow-1"><h2 class="h5 fw-semibold mb-1" th:text="${product.name}">Product</h2>
                    <p class="text-secondary small mb-1" th:text="${product.description}">Description</p>
                    <span class="product-price">$<span th:text="${product.price}">0.00</span></span>
                </div>
                <form class="d-flex flex-wrap gap-2 align-items-center" th:action="@{/admin/products/{id}/image(id=${product.id})}"
                      method="post" enctype="multipart/form-data">
                    <input class="form-control form-control-sm" style="max-width: 230px" type="file" name="image" accept="image/png,image/jpeg" required>
                    <button class="btn btn-outline-primary btn-sm text-nowrap" type="submit">Upload image</button>
                </form>
            </div>
        </article>
    </div>
</main>
</body>
</html>
