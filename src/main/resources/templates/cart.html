<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your cart | Inventory</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}"><span class="brand-mark">S</span> studio<span class="text-primary">.</span></a>
        <a class="btn btn-outline-secondary btn-sm rounded-pill px-3" th:href="@{/}">← Continue shopping</a>
    </div>
</nav>
<main class="container py-5" style="max-width: 850px">
    <div class="eyebrow text-primary">Almost yours</div>
    <h1 class="display-6 fw-bold mb-4">Your cart <span class="text-secondary fs-5 fw-normal" th:text="${'(' + cartCount + ' items)'}">(0 items)</span></h1>
    <div class="panel p-5 text-center" th:if="${#lists.isEmpty(items)}">
        <div class="display-5 mb-2">🛍</div><h2 class="h5">Your cart is waiting</h2>
        <p class="text-secondary">Find something you love and it will show up here.</p>
        <a class="btn btn-primary rounded-pill px-4" th:href="@{/}">Explore the shop</a>
    </div>
    <div th:unless="${#lists.isEmpty(items)}">
        <article class="cart-card d-flex align-items-center justify-content-between gap-3 p-3 p-md-4 mb-3" th:each="item : ${items}">
            <div>
                <h2 class="h5 fw-semibold mb-1" th:text="${item.product.name}">Product</h2>
                <div class="text-secondary small">Quantity <span th:text="${item.quantity}">1</span></div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <strong class="product-price">$<span th:text="${item.lineTotal()}">0.00</span></strong>
                <form th:action="@{/cart/items/{id}/remove(id=${item.product.id})}" method="post">
                    <button class="btn btn-outline-danger btn-sm" type="submit">Remove</button>
                </form>
            </div>
        </article>
        <section class="panel p-4 d-flex align-items-center justify-content-between">
            <div><div class="text-secondary small">Total</div><strong class="fs-4">$<span th:text="${total}">0.00</span></strong></div>
            <form th:action="@{/cart/clear}" method="post"><button class="btn btn-outline-secondary" type="submit">Clear cart</button></form>
        </section>
        <p class="text-secondary small mt-3">This demo cart is saved in your browser session. Checkout is not enabled.</p>
    </div>
</main>
</body>
</html>
