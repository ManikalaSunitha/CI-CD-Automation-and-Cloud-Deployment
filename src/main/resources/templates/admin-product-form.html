<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add product | Studio Admin</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/products}"><span class="brand-mark">S</span> studio <span class="text-white-50 fw-normal">/ Admin</span></a>
        <a class="btn btn-sm btn-outline-light" th:href="@{/admin/products}">← All products</a>
    </div>
</nav>
<main class="container py-5" style="max-width: 760px">
    <div class="eyebrow text-primary">New in the shop</div><h1 class="display-6 fw-bold mb-2">Add a product</h1>
    <p class="text-secondary mb-4">Create a product customers can discover in your storefront.</p>
    <section class="panel p-4 p-md-5">
        <form th:action="@{/admin/products}" th:object="${product}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="name">Product name</label>
                <input class="form-control form-control-lg" id="name" th:field="*{name}" required maxlength="100" placeholder="e.g. Everyday ceramic mug">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="description">Description</label>
                <textarea class="form-control" id="description" rows="3" th:field="*{description}" maxlength="500" placeholder="What makes this one special?"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="price">Price</label>
                <div class="input-group input-group-lg"><span class="input-group-text">$</span>
                    <input class="form-control" id="price" th:field="*{price}" type="number" min="0" step="0.01" required placeholder="0.00">
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" for="image">Product image <span class="text-secondary fw-normal">(optional)</span></label>
                <input class="form-control" id="image" type="file" name="image" accept="image/png,image/jpeg">
                <div class="form-text">PNG or JPEG, up to 5 MB.</div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary btn-lg px-4" type="submit">Create product</button>
                <a class="btn btn-light btn-lg" th:href="@{/admin/products}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
