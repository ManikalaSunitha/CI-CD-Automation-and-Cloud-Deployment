<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin sign in | Studio</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-white border-bottom">
    <div class="container"><a class="navbar-brand text-dark" th:href="@{/}"><span class="brand-mark">S</span> studio<span class="text-primary">.</span></a>
        <a class="text-decoration-none" th:href="@{/}">← Back to shop</a></div>
</nav>
<main class="container login-wrap">
    <section class="login-card p-4 p-md-5">
        <div class="brand-mark mb-3">S</div>
        <div class="eyebrow text-primary">Studio workspace</div>
        <h1 class="h2 fw-bold mt-1 mb-2">Welcome back</h1>
        <p class="text-secondary mb-4">Sign in to manage your shop.</p>
        <div class="alert alert-danger py-2" th:if="${param.error}">That username or password didn't work.</div>
        <div class="alert alert-success py-2" th:if="${param.logout}">You have been signed out.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
        </form>
    </section>
</main>
</body>
</html>
